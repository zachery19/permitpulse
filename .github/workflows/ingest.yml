name: Daily Ingest

on:
  schedule:
    - cron: "15 11 * * *" # 11:15 UTC (~6:15am ET)
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Write env file
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > backend/.env

      - name: Run ingestion
        run: |
          python -m backend.scripts.ingest_logan_bids
